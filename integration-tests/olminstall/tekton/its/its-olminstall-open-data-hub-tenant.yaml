apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: odh-olminstall
  namespace: open-data-hub-tenant
  annotations:
    openshift.io/description: >
      FBC olminstall integration test for opendatahub-builds. For rhoai-tenant or other apps, duplicate this ITS with
      updated namespace/application/contexts after stakeholder alignment (see README).
spec:
  application: opendatahub-builds
  contexts:
    - description: Execute olminstall integration test when FBC (odh-operator-catalog) is built
      name: component_odh-operator-catalog
    - description: Manual olm_pipeline.py snapshots and push-triggered runs
      name: push
    - description: Application-wide integration test
      name: application
  params:
    - name: CLUSTER_SOURCE
      value: "EAAS"
    - name: OCP_VERSION
      value: "latest (default)"
    - name: PRODUCT
      value: "odh"
    - name: RHOAI_VERSION
      value: "n/a"
    - name: UPDATE_CHANNEL
      value: "odh-stable"
    - name: OPERATOR_NAME
      # Konflux odh-stable catalog uses rhods-operator (same as RHOAI); see README OPERATOR_NAME.
      value: "rhods-operator"
    - name: OPERATOR_NAMESPACE
      value: "redhat-ods-operator"
    - name: RHOAI_FBC_NAME
      value: "odh-operator-catalog"
    - name: RHOAI_FBC_IMAGE
      value: "unspecified (default)"
    - name: TEST_GATES
      value: "bvt,smoke"
    - name: SCRIPTS_REPO_URL
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: SCRIPTS_REPO_REVISION
      value: main
  resolverRef:
    params:
      - name: url
        value: https://github.com/opendatahub-io/odh-konflux-central.git
      - name: revision
        value: main
      - name: pathInRepo
        value: integration-tests/olminstall/tekton/pipelines/olminstall-pipelinerun.yaml
    resolver: git
    resourceKind: pipelinerun
