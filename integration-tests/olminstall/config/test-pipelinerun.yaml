---
# Manual test PipelineRun for olminstall integration scenario.
# Usage:
#   oc create -n rhoai-tenant -f integration-tests/olminstall/config/test-pipelinerun.yaml
#
# The run fetches the pipeline from the git resolver (url/revision below).
# Update `revision` to your branch while iterating; set to `main` after merge.
# Update `containerImage` to a known good FBCF image to test against.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: test-olminstall-
  labels:
    appstudio.openshift.io/application: testops-playpen
spec:
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/opendatahub-io/odh-konflux-central.git
      - name: revision
        value: main
      - name: pathInRepo
        value: integration-tests/olminstall/tekton/pipelines/olminstall-pipeline.yaml
  params:
    - name: PRODUCT
      value: odh
    - name: SNAPSHOT
      value: |
        {
          "components": [{
            "name": "odh-operator-catalog",
            "containerImage": "quay.io/opendatahub/odh-operator-catalog:odh-stable"
          }]
        }
    - name: RHOAI_FBC_NAME
      value: odh-operator-catalog
    - name: UPDATE_CHANNEL
      value: odh-stable
    - name: OPERATOR_NAMESPACE
      value: redhat-ods-operator
    - name: OPERATOR_NAME
      value: rhods-operator
    - name: OLMINSTALL_REPO_URL
      value: https://gitlab.cee.redhat.com/data-hub/olminstall.git
    # ODH uses a different pull-secret name; the pipeline default is rhoai-quay-secret
    - name: QUAY_PULL_SECRET_NAME
      value: odh-quay-secret
    - name: TEST_GATES
      value: bvt,smoke
    # External cluster (skip EaaS): create Secret first, then uncomment:
    #   oc create secret generic my-olminstall-kubeconfig \
    #     --from-file=kubeconfig=$HOME/.kube/my-cluster -n rhoai-tenant
    # - name: CLUSTER_SOURCE
    #   value: my-olminstall-kubeconfig
  workspaces:
    - name: tests-shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 15Gi
