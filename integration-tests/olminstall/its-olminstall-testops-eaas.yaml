apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: odh-olminstall-testops-eaas
  namespace: rhoai-tenant
spec:
  application: testops-playpen
  contexts:
    - description: rhoai-fbc-fragment-ocp-421 component builds (EaaS)
      name: component_rhoai-fbc-fragment-ocp-421
  params:
    - name: CLUSTER_SOURCE
      value: "EAAS"
    - name: OCP_VERSION
      value: "latest (default)"
    - name: PRODUCT
      value: "rhoai"
    - name: RHOAI_VERSION
      value: "unspecified (default)"
    - name: UPDATE_CHANNEL
      value: "beta"
    - name: OPERATOR_NAME
      value: "rhods-operator"
    - name: RHOAI_FBC_NAME
      value: "rhoai-fbc-fragment-ocp-421"
    - name: RHOAI_FBC_IMAGE
      value: "unspecified (default)"
    - name: TEST_GATES
      value: "bvt,smoke"
