name: ODH Early Gate Onboarder

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Repository name to onboard to early-gate'
        required: true
        type: choice
        options:
          # Add all valid components here in alphabetical order
          - agents-operator
          - ai-gateway-payload-processing
          - batch-gateway
          - caikit-nlp
          - caikit-tgis-serving
          - codeflare-operator
          - data-science-pipelines
          - data-science-pipelines-operator
          - distributed-workloads
          - eval-hub
          - feast
          - fms-guardrails-orchestrator
          - guardrails-detectors
          - guardrails-regex-detector
          - ilab-on-ocp
          - kserve
          - kserve-autogluon-server
          - kube-auth-proxy
          - kube-rbac-proxy
          - kubeflow
          - kuberay
          - llama-stack-k8s-operator
          - llama-stack-provider-ragas
          - llama-stack-provider-trustyai-garak
          - llm-d-inference-scheduler
          - llm-d-kv-cache
          - llm-d-routing-sidecar
          - lm-evaluation-harness
          - ml-metadata
          - mlflow
          - mlflow-operator
          - mlserver
          - model-registry
          - model-registry-operator
          - modelmesh
          - modelmesh-runtime-adapter
          - modelmesh-serving
          - models-as-a-service
          - NeMo-Guardrails
          - notebooks
          - odh-dashboard
          - odh-data-science-pipelines-argo-argoexec
          - odh-data-science-pipelines-argo-workflowcontroller
          - odh-kserve-llmisvc-controller
          - odh-model-controller
          - odh-model-metadata-collection
          - ogx-distribution
          - ogx-k8s-operator
          - opendatahub-operator
          - openvino_model_server
          - pipelines-components
          - rest-proxy
          - spark-operator
          - text-generation-inference
          - trainer
          - training-operator
          - trustyai-explainability
          - trustyai-service-operator
          - vllm-orchestrator-gateway
          - workload-variant-autoscaler
          - rhaii-cluster-validation
          - odh-observability

      pr_target_branch:
        description: 'Target branch for the PR in the component repo (e.g. main)'
        required: true
        type: string
        default: 'main'

      early_gate_enabled:
        description: 'Enable early-gate for this repository'
        required: true
        type: boolean
        default: true

      additional_branches:
        description: 'Additional branches for early-gate (comma-separated, leave empty if none)'
        required: false
        type: string
        default: ''

      early_gate_required_on_default_branches:
        description: 'Require early-gate on default branches (leave empty to use default behavior)'
        required: false
        type: boolean

jobs:
  onboard-early-gate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - name: Checkout OKC repository
        uses: actions/checkout@v4
        with:
          ref: earlygate
          path: okc-repo

      - name: Generate github-app token
        id: app-token
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.ODH_DEVOPS_APP_ID }}
          private_key: ${{ secrets.ODH_DEVOPS_APP_PRIVATE_KEY }}

      - name: Set environment variables
        run: |
          echo "REPOSITORY=opendatahub-io/${{ inputs.component }}" >> $GITHUB_ENV
          echo "COMPONENT=${{ inputs.component }}" >> $GITHUB_ENV

      - name: Prepare early-gate pipeline files
        run: |
          set -e

          COMPONENT="${{ inputs.component }}"

          echo "Preparing early-gate pipeline files for $COMPONENT"

          mkdir -p .tekton

          # Copy build pipeline
          if [ -f "okc-repo/e2e-early-gate/early-gate-ci-build.yaml" ]; then
            echo "Copying early-gate-ci-build.yaml"
            cp "okc-repo/e2e-early-gate/early-gate-ci-build.yaml" ".tekton/early-gate-ci-build.yaml"
          else
            echo "ERROR: early-gate-ci-build.yaml not found"
            exit 1
          fi

          # Copy test pipeline (if it exists)
          if [ -f "okc-repo/e2e-early-gate/early-gate-ci-test.yaml" ]; then
            echo "Copying early-gate-ci-test.yaml"
            cp "okc-repo/e2e-early-gate/early-gate-ci-test.yaml" ".tekton/early-gate-ci-test.yaml"
          else
            echo "WARNING: early-gate-ci-test.yaml not found, skipping"
          fi

          echo "Early-gate pipeline files prepared"

      - name: Clone and push early-gate changes to component repo
        run: |
          set -e

          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          SOURCE_TEKTON="$WORKSPACE_DIR/.tekton"

          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${REPOSITORY} repo-workspace
          cd repo-workspace

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin ${{ inputs.pr_target_branch }}
          git checkout -B ${{ inputs.pr_target_branch }} origin/${{ inputs.pr_target_branch }}

          ########################################
          # Branch naming
          ########################################

          branch_name="early-gate-onboard-$(date +%s)"
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV

          git checkout -B "$branch_name" ${{ inputs.pr_target_branch }}

          ########################################
          # Copy .tekton files
          ########################################

          mkdir -p .tekton

          if compgen -G "$SOURCE_TEKTON/*.yaml" > /dev/null; then
            echo "Copying early-gate pipeline files from $SOURCE_TEKTON"

            for file in "$SOURCE_TEKTON"/*.yaml; do
              target=".tekton/$(basename "$file")"
              cp "$file" "$target"
              git add -f "$target"
            done
          else
            echo "ERROR: No early-gate YAML files found in $SOURCE_TEKTON"
            exit 1
          fi

          ########################################
          # Commit logic
          ########################################

          if git diff --cached --quiet; then
            echo "No changes to commit in component repo."
            echo "component_commit=false" >> $GITHUB_ENV
          else
            cat <<EOF > commit_message.txt
          Early-gate: add early-gate CI pipelines

          - Added early-gate-ci-build.yaml for build validation
          - Added early-gate-ci-test.yaml for test validation (if available)
          - Pipelines trigger via /early-gate or /early-gate-build comment
          EOF

            git commit -F commit_message.txt
            git push --set-upstream origin "$branch_name"
            echo "component_commit=true" >> $GITHUB_ENV
          fi

      - name: Create Pull Request in component repo
        if: env.component_commit == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd repo-workspace

          cat <<EOF > pr_body.txt
          This PR adds early-gate CI pipelines to the repository.

          ## Changes
          - Added \`.tekton/early-gate-ci-build.yaml\` for build validation
          - Added \`.tekton/early-gate-ci-test.yaml\` for test validation (if available)

          ## Usage
          Comment \`/early-gate\` or \`/early-gate-build\` on a PR to trigger the early-gate build pipeline.

          ## Configuration
          The repository has been added to the early-gate-config.yaml in odh-konflux-central.
          EOF

          gh pr create \
            --repo "${REPOSITORY}" \
            --base "${{ inputs.pr_target_branch }}" \
            --head "${BRANCH_NAME}" \
            --title "Early-gate: add early-gate CI pipelines" \
            --body "$(cat pr_body.txt)"

      - name: Update early-gate-config.yaml
        run: |
          set -e

          cd okc-repo

          CONFIG_FILE="config/early-gate-config.yaml"
          COMPONENT="${{ inputs.component }}"

          echo "Updating $CONFIG_FILE with $COMPONENT"

          # Check if component already exists in config
          if grep -q "^  $COMPONENT:" "$CONFIG_FILE"; then
            echo "Component $COMPONENT already exists in $CONFIG_FILE"
            echo "config_updated=false" >> $GITHUB_ENV
            exit 0
          fi

          # Prepare the repository entry
          REPO_ENTRY="  $COMPONENT:\n    early-gate-enabled: ${{ inputs.early_gate_enabled }}"

          # Add additional-branches if provided
          if [ -n "${{ inputs.additional_branches }}" ]; then
            # Convert comma-separated string to YAML array
            IFS=',' read -ra BRANCHES <<< "${{ inputs.additional_branches }}"
            BRANCH_LIST=""
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)  # trim whitespace
              if [ -n "$branch" ]; then
                BRANCH_LIST="${BRANCH_LIST}\"$branch\", "
              fi
            done
            # Remove trailing comma and space
            BRANCH_LIST=$(echo "$BRANCH_LIST" | sed 's/, $//')
            REPO_ENTRY="${REPO_ENTRY}\n    additional-branches: [$BRANCH_LIST]"
          fi

          # Add early-gate-required-on-default-branches if explicitly set
          if [ "${{ inputs.early_gate_required_on_default_branches }}" = "true" ]; then
            REPO_ENTRY="${REPO_ENTRY}\n    early-gate-required-on-default-branches: true"
          elif [ "${{ inputs.early_gate_required_on_default_branches }}" = "false" ]; then
            REPO_ENTRY="${REPO_ENTRY}\n    early-gate-required-on-default-branches: false"
          fi

          # Append to config file under repositories section
          echo -e "$REPO_ENTRY" >> "$CONFIG_FILE"

          echo "config_updated=true" >> $GITHUB_ENV

          git add "$CONFIG_FILE"

      - name: Commit and push config changes
        if: env.config_updated == 'true'
        run: |
          set -e

          cd okc-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch_name="early-gate-config-${{ inputs.component }}-$(date +%s)"
          echo "CONFIG_BRANCH_NAME=$branch_name" >> $GITHUB_ENV

          git checkout -B "$branch_name"

          cat <<EOF > commit_message.txt
          Early-gate: add ${{ inputs.component }} to early-gate-config

          - Added ${{ inputs.component }} to config/early-gate-config.yaml
          - early-gate-enabled: ${{ inputs.early_gate_enabled }}
          EOF

          git commit -F commit_message.txt
          git push --set-upstream origin "$branch_name"

      - name: Create Pull Request in odh-konflux-central
        if: env.config_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd okc-repo

          cat <<EOF > pr_body.txt
          This PR adds ${{ inputs.component }} to the early-gate configuration.

          ## Configuration
          - **Repository**: ${{ inputs.component }}
          - **Early-gate enabled**: ${{ inputs.early_gate_enabled }}
          - **Additional branches**: ${{ inputs.additional_branches }}
          - **Early-gate required on default branches**: ${{ inputs.early_gate_required_on_default_branches }}

          ## Related
          This is part of onboarding ${{ inputs.component }} to the early-gate system.
          A corresponding PR has been created in opendatahub-io/${{ inputs.component }} to add the pipeline files.
          EOF

          gh pr create \
            --repo "opendatahub-io/odh-konflux-central" \
            --base "earlygate" \
            --head "${CONFIG_BRANCH_NAME}" \
            --title "Early-gate: add ${{ inputs.component }} to config" \
            --body "$(cat pr_body.txt)"
